[build-system]
requires = ["setuptools>=82.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "db-repository"
version = "1.0.0"
description = "Клиент к базе данных для хранения и работы с данными ИИ-агента"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "agent-enums>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.10.0",
]

all = [
    "db-repository[sqlite]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["db_repository*"]