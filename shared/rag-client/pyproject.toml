[build-system]
requires = ["setuptools>=82.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-client"
version = "1.0.0"
description = "Клиент для RAG"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "chromadb>=1.5.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=5.5.0",
]

openai = [
    "openai>=2.0.0",
]

all = [
    "rag-client[local,openai]",
]

dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_client*", "decorators*"]