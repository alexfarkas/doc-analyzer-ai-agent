server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s
    backoff_config:
      min_period: 100ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - doc-analyzer-backend
              - doc-analyser-ui
              - doc-analyzer-postgres
              - doc-analyzer-chromadb
              - doc-analyzer-loki
              - doc-analyzer-grafana
              - doc-analyzer-pgadmin
    
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      
      - source_labels: ['__meta_docker_container_image']
        regex: '(.*)'
        target_label: 'image'
      
      - source_labels: ['__meta_docker_container_id']
        regex: '(.{12}).*'
        target_label: 'container_id'
      
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      
      - source_labels: ['__meta_docker_container_network_mode']
        target_label: 'network_mode'
      
      - source_labels: ['container']
        regex: 'doc-analyzer-(.*)'
        target_label: 'service'
    
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            logger: logger
      
      - labels:
          level:
          logger:
          service:
      
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      
      - output:
          source: message
      
      - drop:
          source: password
          expression: ".*"
      
      - drop:
          source: token
          expression: ".*"
      
      - metrics:
          log_lines_total:
            type: Counter
            description: "Total log lines"
            source: container
            config:
              action: inc
              prefix: promtail_custom_
          
          error_logs_total:
            type: Counter
            description: "Error log lines"
            source: level
            config:
              action: inc
              value: error
              prefix: promtail_custom_
      
      - limit:
          rate: 100
          burst: 200
          drop: true

  - job_name: nginx
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters:
          - name: name
            values:
              - doc-analyser-ui
    
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['container']
        target_label: 'service'
        replacement: 'nginx'
    
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<method>\S+)\s+(?P<path>\S+)\s+(?P<protocol>\S+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
      
      - labels:
          method:
          status:
      
      - metrics:
          http_requests_total:
            type: Counter
            description: "Total HTTP requests"
            source: status
            config:
              action: inc
              match_all: true
              prefix: promtail_custom_
      
      - match:
          selector: '{status=~"5.."}'
          stages:
            - labels:
                level: "error"
      
      - match:
          selector: '{status=~"4.."}'
          stages:
            - labels:
                level: "warn"